name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-contribution-grid-snake.svg?color_snake=#f0b429&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            assets/snake/github-contribution-grid-snake-dark.svg?color_snake=#3dd6c3&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      # Committing to main lets the README load the snake as a repository-relative
      # asset, which GitHub serves same-origin like every other image on the profile.
      - name: Commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          if git diff --staged --quiet; then
            echo "Snake unchanged"
          else
            git commit -m "chore: refresh contribution snake"
            git push
          fi
