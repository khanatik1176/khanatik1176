name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/github-contribution-grid-snake.svg?color_snake=#e06c84&color_dots=#e8eaf0,#a9b8e8,#7aa2f7,#5a8af0,#bb9af7
            assets/snake/github-contribution-grid-snake-dark.svg?color_snake=#f7768e&color_dots=#1a1b27,#3d59a1,#7aa2f7,#7dcfff,#bb9af7



      # Committing to main lets the README load the snake as a repository-relative
      # asset, which GitHub serves same-origin like every other image on the profile.
      - name: Commit refreshed snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          if git diff --staged --quiet; then
            echo "Snake unchanged"
          else
            git commit -m "chore: refresh contribution snake"
            git push
          fi
