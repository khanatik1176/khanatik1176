<svg width="680" height="320" viewBox="0 0 680 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="680" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1B27"/>
      <stop offset="1" stop-color="#24283B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AA2F7"/>
      <stop offset="1" stop-color="#BB9AF7"/>
    </linearGradient>
    <style>
      .row { animation: fade .7s ease both; }
      .r2 { animation-delay: .1s; }
      .r3 { animation-delay: .2s; }
      .r4 { animation-delay: .3s; }
      .bar { animation: glow 2.8s ease-in-out infinite; }
      @keyframes fade {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes glow {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .row, .bar { animation: none; }
        .row { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="680" height="320" rx="18" fill="url(#bg)"/>
