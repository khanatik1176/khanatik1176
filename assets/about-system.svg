<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fade { animation: fadeUp 1s ease both; }
      .step { animation: stepIn .8s ease both; }
      .s2 { animation-delay: .15s; }
      .s3 { animation-delay: .3s; }
      .s4 { animation-delay: .45s; }
      .flow { stroke-dasharray: 8 12; animation: flow 2.4s linear infinite; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes stepIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes flow { to { stroke-dashoffset: -40; } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .step, .flow { animation: none; }
        .fade, .step { opacity: 1; }
      }
    </style>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3F4F6"/>
      <stop offset="1" stop-color="#E6EAEF"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#12151A" fill-opacity=".05"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#canvas)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <path d="M0 0H1200" stroke="#1E4A7A" stroke-width="3"/>

  <g class="fade" transform="translate(72 56)">
    <text x="0" y="0" fill="#A67C2D" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="3.5">ABOUT</text>
    <text x="0" y="52" fill="#12151A" font-size="36" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-weight="700">I build the whole product loop.</text>
    <text x="0" y="96" fill="#4A5360" font-size="18" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Polished interfaces, useful APIs, structured data, and delivery</text>
    <text x="0" y="124" fill="#4A5360" font-size="18" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">systems that keep software moving from idea to production.</text>
  </g>

  <path class="flow" d="M72 220H1128" stroke="#1E4A7A" stroke-opacity=".28" stroke-width="1.5"/>

  <g transform="translate(72 248)">
    <g class="step">
      <text x="0" y="0" fill="#1E4A7A" font-size="12" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">01</text>
      <text x="36" y="0" fill="#12151A" font-size="16" font-family="Palatino Linotype, Palatino, Georgia, serif">Idea</text>
    </g>
    <g class="step s2" transform="translate(270 0)">
      <text x="0" y="0" fill="#1E4A7A" font-size="12" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">02</text>
      <text x="36" y="0" fill="#12151A" font-size="16" font-family="Palatino Linotype, Palatino, Georgia, serif">Build</text>
    </g>
    <g class="step s3" transform="translate(540 0)">
      <text x="0" y="0" fill="#1E4A7A" font-size="12" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">03</text>
      <text x="36" y="0" fill="#12151A" font-size="16" font-family="Palatino Linotype, Palatino, Georgia, serif">Ship</text>
    </g>
    <g class="step s4" transform="translate(810 0)">
      <text x="0" y="0" fill="#1E4A7A" font-size="12" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">04</text>
      <text x="36" y="0" fill="#12151A" font-size="16" font-family="Palatino Linotype, Palatino, Georgia, serif">Improve</text>
    </g>
  </g>
</svg>
