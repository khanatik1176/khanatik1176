<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="30" y1="20" x2="1170" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071421"/>
      <stop offset=".5" stop-color="#0B1C2C"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <linearGradient id="signal" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".4" stop-color="#2DD4BF"/>
      <stop offset=".75" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .wave{animation:wave 2s linear infinite}
      .card{animation:card 4s ease-in-out infinite}
      .c2{animation-delay:.35s}.c3{animation-delay:.7s}.c4{animation-delay:1.05s}
      .icon{animation:icon 3s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
      @keyframes wave{to{stroke-dashoffset:-48}}
      @keyframes card{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
      @keyframes icon{0%,100%{opacity:.72}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.pulse,.wave,.card,.icon{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="350" rx="28" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="1198.5" height="348.5" rx="27.25" stroke="#1D3B51" stroke-width="1.5"/>

  <circle class="pulse" cx="70" cy="48" r="6" fill="#A3E635" filter="url(#glow)"/>
  <text x="89" y="54" fill="#BEF264" font-size="14" font-family="ui-monospace, SFMono-Regular, monospace" font-weight="700" letter-spacing="2">NOW TRANSMITTING</text>
  <text x="1130" y="53" text-anchor="end" fill="#64748B" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace">SIGNAL / 04</text>

  <path class="wave" d="M55 91H285L301 76L319 105L339 62L359 110L379 82L397 91H1145" stroke="url(#signal)" stroke-width="2" stroke-dasharray="8 16"/>

  <g transform="translate(48 119)">
    <rect class="card" width="264" height="182" rx="20" fill="#0D2030" stroke="#22D3EE"/>
    <text x="22" y="31" fill="#4A6A80" font-size="12" font-family="ui-monospace, monospace">01 / CRAFT</text>
    <g class="icon" transform="translate(22 49)" fill="none" stroke="#67E8F9" stroke-width="2.3" stroke-linejoin="round">
      <path d="M28 2L54 16L28 30L2 16L28 2Z"/>
      <path d="M2 28L28 42L54 28M2 40L28 54L54 40"/>
    </g>
    <text x="22" y="126" fill="#E2E8F0" font-size="18" font-family="Inter, ui-sans-serif, sans-serif" font-weight="700">Full-stack products</text>
    <text x="22" y="151" fill="#64748B" font-size="13" font-family="ui-monospace, monospace">interface -&gt; API -&gt; data</text>
    <rect x="22" y="166" width="220" height="3" rx="1.5" fill="#123247"/>
    <rect x="22" y="166" width="190" height="3" rx="1.5" fill="#22D3EE"/>
  </g>

  <g transform="translate(328 119)">
    <rect class="card c2" width="264" height="182" rx="20" fill="#0D2030" stroke="#2DD4BF"/>
    <text x="22" y="31" fill="#4A6A80" font-size="12" font-family="ui-monospace, monospace">02 / FOCUS</text>
    <g class="icon" transform="translate(22 49)" fill="none" stroke="#5EEAD4" stroke-width="2.3">
      <circle cx="28" cy="28" r="26"/>
      <circle cx="28" cy="28" r="16"/>
      <circle cx="28" cy="28" r="6" fill="#2DD4BF"/>
      <path d="M46 10L28 28" stroke-linecap="round"/>
    </g>
    <text x="22" y="126" fill="#E2E8F0" font-size="18" font-family="Inter, ui-sans-serif, sans-serif" font-weight="700">Clean architecture</text>
    <text x="22" y="151" fill="#64748B" font-size="13" font-family="ui-monospace, monospace">readable / scalable / clear</text>
    <rect x="22" y="166" width="220" height="3" rx="1.5" fill="#123247"/>
    <rect x="22" y="166" width="176" height="3" rx="1.5" fill="#2DD4BF"/>
  </g>

  <g transform="translate(608 119)">
    <rect class="card c3" width="264" height="182" rx="20" fill="#0D2030" stroke="#5EEAD4"/>
    <text x="22" y="31" fill="#4A6A80" font-size="12" font-family="ui-monospace, monospace">03 / LEARNING</text>
    <g class="icon" transform="translate(22 49)" fill="none" stroke="#99F6E4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="54" height="48" rx="8"/>
      <path d="M14 18L22 26L14 34M28 38H43"/>
      <circle cx="48" cy="11" r="6" fill="#5EEAD4" stroke="#0D2030"/>
    </g>
    <text x="22" y="126" fill="#E2E8F0" font-size="18" font-family="Inter, ui-sans-serif, sans-serif" font-weight="700">DevOps systems</text>
    <text x="22" y="151" fill="#64748B" font-size="13" font-family="ui-monospace, monospace">containers / CI / delivery</text>
    <rect x="22" y="166" width="220" height="3" rx="1.5" fill="#123247"/>
    <rect x="22" y="166" width="142" height="3" rx="1.5" fill="#5EEAD4"/>
  </g>

  <g transform="translate(888 119)">
    <rect class="card c4" width="264" height="182" rx="20" fill="#0D2030" stroke="#A3E635"/>
    <text x="22" y="31" fill="#4A6A80" font-size="12" font-family="ui-monospace, monospace">04 / NEXT</text>
    <g class="icon" transform="translate(22 49)" fill="none" stroke="#BEF264" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M25 38C12 42 8 49 6 55C12 54 19 51 24 46M38 25C42 12 49 8 55 6C54 12 51 19 46 24"/>
      <path d="M18 42C17 27 28 13 53 4C44 29 32 40 18 42Z"/>
      <circle cx="39" cy="18" r="5"/>
      <path d="M13 51L5 59M20 55L14 61"/>
    </g>
    <text x="22" y="126" fill="#E2E8F0" font-size="18" font-family="Inter, ui-sans-serif, sans-serif" font-weight="700">Measure + improve</text>
    <text x="22" y="151" fill="#64748B" font-size="13" font-family="ui-monospace, monospace">build -&gt; learn -&gt; repeat</text>
    <rect x="22" y="166" width="220" height="3" rx="1.5" fill="#123247"/>
    <rect x="22" y="166" width="204" height="3" rx="1.5" fill="#A3E635"/>
  </g>

  <text x="600" y="329" text-anchor="middle" fill="#3C5A6E" font-size="11" font-family="ui-monospace, monospace" letter-spacing="3">CONTINUOUSLY BUILDING / CONTINUOUSLY LEARNING</text>
</svg>
