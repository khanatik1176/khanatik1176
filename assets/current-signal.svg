<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .item { animation: itemIn .85s ease both; }
      .i2 { animation-delay: .12s; }
      .i3 { animation-delay: .24s; }
      .i4 { animation-delay: .36s; }
      .bar { animation: barPulse 3.2s ease-in-out infinite; }
      @keyframes itemIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes barPulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .item, .bar { animation: none; }
        .item { opacity: 1; }
      }
    </style>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F3F5"/>
      <stop offset="1" stop-color="#E5E9EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#canvas)"/>
  <path d="M0 0H1200" stroke="#1E4A7A" stroke-width="3"/>
  <path class="bar" d="M72 58H168" stroke="#A67C2D" stroke-width="2" stroke-linecap="round"/>

  <text x="72" y="42" fill="#12151A" font-size="32" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-weight="700">Current focus</text>
  <text x="72" y="80" fill="#5C6570" font-size="16" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">What I’m sharpening while I keep shipping.</text>

  <g transform="translate(72 126)">
    <g class="item">
      <text x="0" y="0" fill="#A67C2D" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">01</text>
      <text x="0" y="34" fill="#12151A" font-size="22" font-family="Palatino Linotype, Palatino, Georgia, serif">Full-stack products</text>
      <text x="0" y="62" fill="#5C6570" font-size="14" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Interface → API → data</text>
    </g>
    <g class="item i2" transform="translate(280 0)">
      <text x="0" y="0" fill="#A67C2D" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">02</text>
      <text x="0" y="34" fill="#12151A" font-size="22" font-family="Palatino Linotype, Palatino, Georgia, serif">Clean architecture</text>
      <text x="0" y="62" fill="#5C6570" font-size="14" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Readable, scalable, clear</text>
    </g>
    <g class="item i3" transform="translate(560 0)">
      <text x="0" y="0" fill="#A67C2D" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">03</text>
      <text x="0" y="34" fill="#12151A" font-size="22" font-family="Palatino Linotype, Palatino, Georgia, serif">DevOps systems</text>
      <text x="0" y="62" fill="#5C6570" font-size="14" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Containers, CI, delivery</text>
    </g>
    <g class="item i4" transform="translate(840 0)">
      <text x="0" y="0" fill="#A67C2D" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">04</text>
      <text x="0" y="34" fill="#12151A" font-size="22" font-family="Palatino Linotype, Palatino, Georgia, serif">Measure &amp; improve</text>
      <text x="0" y="62" fill="#5C6570" font-size="14" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Build → learn → repeat</text>
    </g>
  </g>

  <path d="M72 230H1128" stroke="#C5CCD4"/>
  <text x="600" y="268" text-anchor="middle" fill="#6B7380" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2">CONTINUOUSLY BUILDING · CONTINUOUSLY LEARNING</text>
</svg>
