<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="mui">
  <!-- glow -->
  <rect x="2" y="2" width="68" height="68" rx="18" fill="#007FFF" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.34;0.14" dur="2.8s" begin="0.36s" repeatCount="indefinite"/>
  </rect>

  <!-- card uses solid fills only for GitHub CSP compatibility -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="3.2s" begin="0.36s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="#1a1b27" stroke="#007FFF" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="60" height="5" rx="2.5" fill="#007FFF">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.36s" repeatCount="indefinite"/>
    </rect>
    <g fill="none" stroke="#7AA2F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 42V28l8 8 8-10v16"/>
      <path d="M44 28v14"/>
      <circle cx="44" cy="24" r="2.2" fill="#7AA2F7" stroke="none"/>
    </g>
  </g>
</svg>
