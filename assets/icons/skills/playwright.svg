<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="playwright">
  <defs>
    <linearGradient id="bg-playwright" x1="0" y1="0" x2="72" y2="72">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
  </defs>

  <!-- soft accent glow -->
  <rect x="3" y="3" width="66" height="66" rx="18" fill="#2EAD33" opacity="0.28">
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="2.8s" begin="0.52s" repeatCount="indefinite"/>
  </rect>

  <!-- floating card -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.2s" begin="0.52s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="url(#bg-playwright)" stroke="#2EAD33" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="6" y="6" width="60" height="4" rx="2" fill="#2EAD33">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.52s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0.95">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" begin="0.52s" repeatCount="indefinite"/>
      <g fill="#9ECE6A">
      <circle cx="28" cy="30" r="8" fill="none" stroke="#9ECE6A" stroke-width="2.4"/>
      <circle cx="44" cy="30" r="8" fill="none" stroke="#9ECE6A" stroke-width="2.4"/>
      <circle cx="28" cy="30" r="2.4"/>
      <circle cx="44" cy="30" r="2.4"/>
      <path d="M24 44c2.5-3 6-4.5 12-4.5S45.5 41 48 44" fill="none" stroke="#9ECE6A" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    </g>
  </g>
</svg>
