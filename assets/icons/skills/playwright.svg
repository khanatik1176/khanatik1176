<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="playwright">
  <!-- glow -->
  <rect x="2" y="2" width="68" height="68" rx="18" fill="#2EAD33" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.34;0.14" dur="2.8s" begin="0.52s" repeatCount="indefinite"/>
  </rect>

  <!-- card uses solid fills only for GitHub CSP compatibility -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="3.2s" begin="0.52s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="#1a1b27" stroke="#2EAD33" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="60" height="5" rx="2.5" fill="#2EAD33">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.52s" repeatCount="indefinite"/>
    </rect>
    <g fill="#9ECE6A">
      <circle cx="28" cy="30" r="8" fill="none" stroke="#9ECE6A" stroke-width="2.4"/>
      <circle cx="44" cy="30" r="8" fill="none" stroke="#9ECE6A" stroke-width="2.4"/>
      <circle cx="28" cy="30" r="2.4"/>
      <circle cx="44" cy="30" r="2.4"/>
      <path d="M24 44c2.5-3 6-4.5 12-4.5S45.5 41 48 44" fill="none" stroke="#9ECE6A" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
