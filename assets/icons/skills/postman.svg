<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="postman">
  <!-- glow -->
  <rect x="2" y="2" width="68" height="68" rx="18" fill="#FF6C37" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.34;0.14" dur="2.8s" begin="0.12s" repeatCount="indefinite"/>
  </rect>

  <!-- card uses solid fills only for GitHub CSP compatibility -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="3.2s" begin="0.12s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="#1a1b27" stroke="#FF6C37" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="60" height="5" rx="2.5" fill="#FF6C37">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.12s" repeatCount="indefinite"/>
    </rect>
    <g>
      <circle cx="36" cy="36" r="15" fill="#FF9E64"/>
      <path fill="#1a1b27" d="M24.8 34.5c4.5-1.1 13.5-2.2 21.4 1-2 1.5-4.9 3.2-7.9 4-4.5-3.4-9.6-4.2-13.5-5Z"/>
    </g>
  </g>
</svg>
