<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="react">
  <!-- glow -->
  <rect x="2" y="2" width="68" height="68" rx="18" fill="#61DAFB" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.34;0.14" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
  </rect>

  <!-- card uses solid fills only for GitHub CSP compatibility -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="#1a1b27" stroke="#61DAFB" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="60" height="5" rx="2.5" fill="#61DAFB">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <g fill="none" stroke="#7DCFFF" stroke-width="2.2">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 36 36" to="360 36 36" dur="14s" repeatCount="indefinite"/>
        <ellipse cx="36" cy="36" rx="18" ry="7.2" transform="rotate(60 36 36)"/>
        <ellipse cx="36" cy="36" rx="18" ry="7.2" transform="rotate(-60 36 36)"/>
        <ellipse cx="36" cy="36" rx="18" ry="7.2"/>
      </g>
      <circle cx="36" cy="36" r="3.4" fill="#7DCFFF" stroke="none"/>
    </g>
  </g>
</svg>
