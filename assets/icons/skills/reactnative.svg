<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="reactnative">
  <defs>
    <linearGradient id="bg-reactnative" x1="0" y1="0" x2="72" y2="72">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
  </defs>

  <!-- soft accent glow -->
  <rect x="3" y="3" width="66" height="66" rx="18" fill="#61DAFB" opacity="0.28">
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="2.8s" begin="0.88s" repeatCount="indefinite"/>
  </rect>

  <!-- floating card -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.2s" begin="0.88s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="url(#bg-reactnative)" stroke="#61DAFB" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="6" y="6" width="60" height="4" rx="2" fill="#61DAFB">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.88s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0.95">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" begin="0.88s" repeatCount="indefinite"/>
      <g>
      <g fill="none" stroke="#7DCFFF" stroke-width="2">
        <ellipse cx="36" cy="33" rx="16" ry="6.4" transform="rotate(60 36 33)"/>
        <ellipse cx="36" cy="33" rx="16" ry="6.4" transform="rotate(-60 36 33)"/>
        <ellipse cx="36" cy="33" rx="16" ry="6.4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 36 33" to="360 36 33" dur="14s" repeatCount="indefinite"/>
      </g>
      <circle cx="36" cy="33" r="3" fill="#7DCFFF"/>
      <text x="36" y="52" text-anchor="middle" fill="#7AA2F7" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">NATIVE</text>
    </g>
    </g>
  </g>
</svg>
