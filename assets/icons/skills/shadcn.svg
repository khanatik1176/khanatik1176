<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="shadcn">
  <!-- glow -->
  <rect x="2" y="2" width="68" height="68" rx="18" fill="#C0CAF5" opacity="0.22">
    <animate attributeName="opacity" values="0.14;0.34;0.14" dur="2.8s" begin="0.2s" repeatCount="indefinite"/>
  </rect>

  <!-- card uses solid fills only for GitHub CSP compatibility -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="3.2s" begin="0.2s" repeatCount="indefinite"/>
    <rect x="6" y="6" width="60" height="60" rx="16" fill="#1a1b27" stroke="#C0CAF5" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="60" height="5" rx="2.5" fill="#C0CAF5">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <g fill="none" stroke="#C0CAF5" stroke-width="3.2" stroke-linecap="round">
      <path d="M26 28 36 18l10 10"/>
      <path d="M26 44 36 54l10-10"/>
      <path d="M30 36h12"/>
    </g>
  </g>
</svg>
