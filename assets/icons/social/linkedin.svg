    <rect x="6" y="6" width="60" height="4" rx="2" fill="#0A66C2">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
    <g opacity="0.95">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" begin="0.0s" repeatCount="indefinite"/>
      <g fill="#7AA2F7">
      <rect x="22" y="30" width="5.5" height="18" rx="1"/>
      <circle cx="24.8" cy="24" r="3.2"/>
      <path d="M31 30h5.8v2.5c1.3-2 3.3-3.1 6-3.1 5.6 0 6.8 3.7 6.8 8.5V48H43.7v-9.2c0-2.2 0-5-3.1-5s-3.6 2.4-3.6 4.8V48H31V30Z"/>
