    <rect x="6" y="6" width="60" height="60" rx="16" fill="#1a1b27" stroke="#0A66C2" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="60" height="5" rx="2.5" fill="#0A66C2">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
    <g fill="#7AA2F7">
      <rect x="22" y="30" width="5.5" height="18" rx="1"/>
      <circle cx="24.8" cy="24" r="3.2"/>
      <path d="M31 30h5.8v2.5c1.3-2 3.3-3.1 6-3.1 5.6 0 6.8 3.7 6.8 8.5V48H43.7v-9.2c0-2.2 0-5-3.1-5s-3.6 2.4-3.6 4.8V48H31V30Z"/>
