<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .slide { animation: slideIn .9s ease both; }
      .rule { animation: ruleGrow 1.2s ease .3s both; transform-origin: left center; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes ruleGrow {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .slide, .rule { animation: none; }
        .slide { opacity: 1; }
        .rule { transform: scaleX(1); }
      }
    </style>
  </defs>
  <rect width="1200" height="160" fill="#F7F7F5"/>
  <rect x="0" y="0" width="8" height="160" fill="#C1121F"/>

  <g class="slide">
    <text x="48" y="108" fill="#141414" font-size="92" font-family="Georgia, Times New Roman, serif" font-weight="700" letter-spacing="-4">KAF</text>
    <line x1="280" y1="36" x2="280" y2="124" stroke="#D8D8D4" stroke-width="1.5"/>
    <text x="312" y="68" fill="#141414" font-size="28" font-family="Georgia, Times New Roman, serif" font-weight="700">Khan Atik Faisal</text>
    <text x="312" y="100" fill="#5A5A5A" font-size="16" font-family="Trebuchet MS, sans-serif">Full Stack Developer · Bangladesh</text>
    <text x="1152" y="100" text-anchor="end" fill="#8A8A8A" font-size="13" font-family="Trebuchet MS, sans-serif" letter-spacing="3">INDEX / 2026</text>
  </g>
  <rect class="rule" x="48" y="148" width="1104" height="2" fill="#C1121F"/>
</svg>
