<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: drawLine 1.8s ease forwards; }
      .rise { animation: riseIn 1.1s ease both; }
      .rise-late { animation: riseIn 1.1s ease .25s both; }
      .mark { animation: markDrift 8s ease-in-out infinite; }
      .rule { animation: rulePulse 4s ease-in-out infinite; }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes markDrift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(0, -8px); }
      }
      @keyframes rulePulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .draw, .rise, .rise-late, .mark, .rule { animation: none; }
        .draw { stroke-dashoffset: 0; }
        .rise, .rise-late { opacity: 1; }
      }
    </style>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7EBEF"/>
      <stop offset=".48" stop-color="#F3F4F6"/>
      <stop offset="1" stop-color="#E4E8ED"/>
    </linearGradient>
    <linearGradient id="wash" x1="720" y1="40" x2="1180" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4A7A" stop-opacity=".10"/>
      <stop offset="1" stop-color="#A67C2D" stop-opacity=".06"/>
    </linearGradient>
    <pattern id="hatch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 14H28" stroke="#1A1C1E" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#canvas)"/>
  <rect width="1200" height="460" fill="url(#hatch)"/>
  <rect width="1200" height="460" fill="url(#wash)"/>
  <path d="M0 0H1200" stroke="#1E4A7A" stroke-width="3"/>
  <path class="rule" d="M0 457H1200" stroke="#A67C2D" stroke-width="2" stroke-opacity=".55"/>

  <g class="rise" transform="translate(72 88)">
    <text x="0" y="0" fill="#5C6570" font-size="15" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="4">FULL STACK DEVELOPER</text>
    <text x="0" y="78" fill="#12151A" font-size="72" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-weight="700">Khan Atik</text>
    <text x="0" y="148" fill="#12151A" font-size="72" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-weight="700">Faisal</text>
    <path class="draw" d="M2 168H318" stroke="#1E4A7A" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="220" fill="#3D4651" font-size="22" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">I design and ship dependable product systems.</text>
    <text x="0" y="258" fill="#6B7380" font-size="17" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Based in Bangladesh · Building across the stack</text>
  </g>

  <g class="mark rise-late" transform="translate(760 70)">
    <circle cx="180" cy="160" r="148" fill="none" stroke="#1E4A7A" stroke-opacity=".14" stroke-width="1"/>
    <circle cx="180" cy="160" r="108" fill="none" stroke="#A67C2D" stroke-opacity=".22" stroke-width="1"/>
    <path d="M80 210L180 52L280 210Z" fill="none" stroke="#12151A" stroke-width="1.5"/>
    <path d="M118 210L180 108L242 210" fill="none" stroke="#1E4A7A" stroke-width="1.25" stroke-opacity=".7"/>
    <line x1="180" y1="52" x2="180" y2="268" stroke="#12151A" stroke-opacity=".2"/>
    <line x1="70" y1="160" x2="290" y2="160" stroke="#12151A" stroke-opacity=".2"/>
    <circle cx="180" cy="160" r="6" fill="#A67C2D"/>
    <text x="180" y="292" text-anchor="middle" fill="#5C6570" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="3">STRUCTURE · CLARITY · SHIP</text>
  </g>
</svg>
