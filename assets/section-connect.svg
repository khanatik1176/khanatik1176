<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="88" viewBox="0 0 1100 88">
  <defs>
    <style>
      .a { animation: drift 6s ease-in-out infinite; }
      .b { animation: drift 8s ease-in-out infinite reverse; }
      .c { animation: pulse 4s ease-in-out infinite; }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(18px, -6px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: .7; }
      }
      @media (prefers-reduced-motion: reduce) {
        .a, .b, .c { animation: none; }
      }
    </style>
  </defs>
  <rect width="1100" height="88" rx="16" fill="#EEF4FF"/>
  <circle class="a" cx="90" cy="44" r="36" fill="#C9DBFF"/>
  <circle class="b" cx="980" cy="30" r="48" fill="#DDE7FF"/>
  <circle class="c" cx="520" cy="70" r="28" fill="#BFD3FF"/>
  <rect x="28" y="36" width="8" height="28" rx="4" fill="#7AA2F7"/>
  <text x="52" y="56" fill="#1A1B27" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Connect with me</text>
  <text x="1070" y="54" text-anchor="end" fill="#5B6B8C" font-size="14" font-family="Arial, Helvetica, sans-serif">lets build together</text>
</svg>
