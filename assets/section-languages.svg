<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="88" viewBox="0 0 1100 88">
  <defs>
    <style>
      .a { animation: drift 7s ease-in-out infinite; }
      .b { animation: drift 9s ease-in-out infinite reverse; }
      .c { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-16px, 8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .3; }
        50% { opacity: .65; }
      }
      @media (prefers-reduced-motion: reduce) {
        .a, .b, .c { animation: none; }
      }
    </style>
  </defs>
  <rect width="1100" height="88" rx="16" fill="#EEFBF3"/>
  <circle class="a" cx="120" cy="20" r="40" fill="#C9F0D8"/>
  <circle class="b" cx="900" cy="60" r="44" fill="#D7F5E4"/>
  <circle class="c" cx="480" cy="18" r="24" fill="#B8EACB"/>
  <rect x="28" y="36" width="8" height="28" rx="4" fill="#9ECE6A"/>
  <text x="52" y="56" fill="#1A1B27" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Languages</text>
  <text x="1070" y="54" text-anchor="end" fill="#4F6B5A" font-size="14" font-family="Arial, Helvetica, sans-serif">code I write in</text>
</svg>
