<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="88" viewBox="0 0 1100 88">
  <defs>
    <style>
      .a { animation: drift 6.5s ease-in-out infinite; }
      .b { animation: drift 8.5s ease-in-out infinite reverse; }
      .c { animation: pulse 4.2s ease-in-out infinite; }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(14px, 7px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: .28; }
        50% { opacity: .6; }
      }
      @media (prefers-reduced-motion: reduce) {
        .a, .b, .c { animation: none; }
      }
    </style>
  </defs>
  <rect width="1100" height="88" rx="16" fill="#F7F0FF"/>
  <circle class="a" cx="70" cy="58" r="38" fill="#E4D4FF"/>
  <circle class="b" cx="1020" cy="24" r="46" fill="#EDDFFF"/>
  <circle class="c" cx="560" cy="72" r="26" fill="#DCC4FF"/>
  <rect x="28" y="36" width="8" height="28" rx="4" fill="#BB9AF7"/>
  <text x="52" y="56" fill="#1A1B27" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Tools &amp; Frameworks</text>
  <text x="1070" y="54" text-anchor="end" fill="#6A5B80" font-size="14" font-family="Arial, Helvetica, sans-serif">what I build with</text>
</svg>
