<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fade { animation: fadeUp .9s ease both; }
      .path { stroke-dasharray: 10 14; animation: pathMove 2.2s linear infinite; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pathMove { to { stroke-dashoffset: -48; } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .path { animation: none; }
        .fade { opacity: 1; }
      }
    </style>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7EBEF"/>
      <stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="trail" x1="720" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4A7A" stop-opacity="0"/>
      <stop offset=".4" stop-color="#1E4A7A"/>
      <stop offset="1" stop-color="#A67C2D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="180" fill="url(#canvas)"/>
  <path d="M0 0H1200" stroke="#1E4A7A" stroke-width="3"/>

  <g class="fade" transform="translate(72 58)">
    <text x="0" y="0" fill="#A67C2D" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="3">ACTIVITY</text>
    <text x="0" y="44" fill="#12151A" font-size="34" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-weight="700">Contribution trail</text>
    <text x="0" y="80" fill="#5C6570" font-size="16" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">Every commit leaves a mark. Auto-refreshed every 12 hours.</text>
  </g>

  <g transform="translate(760 48)">
    <rect x="0" y="0" width="368" height="92" fill="none" stroke="#C5CCD4"/>
    <path class="path" d="M28 62H88V42H148V28H208V42H268V62H328" stroke="url(#trail)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="328" cy="62" r="5" fill="#A67C2D"/>
  </g>
</svg>
