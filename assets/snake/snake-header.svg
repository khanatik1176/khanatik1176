<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72" role="img" aria-label="Contribution snake header">
  <rect width="880" height="72" fill="#1a1b27"/>
  <rect x="0" y="0" width="880" height="3" fill="#7AA2F7">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="69" width="880" height="3" fill="#BB9AF7" opacity="0.7"/>

  <!-- left accent dots -->
  <circle cx="36" cy="36" r="5" fill="#7AA2F7"/>
  <circle cx="52" cy="36" r="4" fill="#7DCFFF" opacity="0.85"/>
  <circle cx="66" cy="36" r="3" fill="#BB9AF7" opacity="0.7"/>
  <circle cx="78" cy="36" r="2.5" fill="#F7768E">
    <animate attributeName="cx" values="78;96;78" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="440" y="32" text-anchor="middle" fill="#7AA2F7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3.5">CONTRIBUTION GRAPH</text>
  <text x="440" y="54" text-anchor="middle" fill="#C0CAF5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Snake eats the commits</text>

  <!-- right accent dots -->
  <circle cx="844" cy="36" r="5" fill="#BB9AF7"/>
  <circle cx="828" cy="36" r="4" fill="#7DCFFF" opacity="0.85"/>
  <circle cx="814" cy="36" r="3" fill="#7AA2F7" opacity="0.7"/>
  <circle cx="802" cy="36" r="2.5" fill="#F7768E">
    <animate attributeName="cx" values="802;784;802" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
