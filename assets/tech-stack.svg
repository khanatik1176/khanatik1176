<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .row { animation: rowIn .9s ease both; }
      .r2 { animation-delay: .1s; }
      .r3 { animation-delay: .2s; }
      .r4 { animation-delay: .3s; }
      .accent { animation: accentGlow 3.5s ease-in-out infinite; }
      @keyframes rowIn {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes accentGlow {
        0%, 100% { opacity: .4; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .row, .accent { animation: none; }
        .row { opacity: 1; }
      }
    </style>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6EAEF"/>
      <stop offset=".55" stop-color="#F2F3F5"/>
      <stop offset="1" stop-color="#E8ECF0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#canvas)"/>
  <path d="M0 0H1200" stroke="#1E4A7A" stroke-width="3"/>
  <path class="accent" d="M72 78H220" stroke="#A67C2D" stroke-width="2" stroke-linecap="round"/>

  <text x="72" y="58" fill="#12151A" font-size="34" font-family="Palatino Linotype, Palatino, Book Antiqua, Georgia, serif" font-weight="700">Tools I work with</text>
  <text x="72" y="98" fill="#5C6570" font-size="16" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif">A practical stack for interfaces, services, data, and delivery.</text>

  <g class="row" transform="translate(72 148)">
    <text x="0" y="0" fill="#1E4A7A" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2.5">LANGUAGES</text>
    <path d="M0 16H1056" stroke="#C5CCD4"/>
    <text x="0" y="48" fill="#12151A" font-size="20" font-family="Palatino Linotype, Palatino, Georgia, serif">JavaScript · TypeScript · Python · C# · C++</text>
  </g>

  <g class="row r2" transform="translate(72 222)">
    <text x="0" y="0" fill="#1E4A7A" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2.5">FRONTEND</text>
    <path d="M0 16H1056" stroke="#C5CCD4"/>
    <text x="0" y="48" fill="#12151A" font-size="20" font-family="Palatino Linotype, Palatino, Georgia, serif">React · Next.js · Tailwind · Material UI · HTML / CSS</text>
  </g>

  <g class="row r3" transform="translate(72 296)">
    <text x="0" y="0" fill="#1E4A7A" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2.5">BACKEND</text>
    <path d="M0 16H1056" stroke="#C5CCD4"/>
    <text x="0" y="48" fill="#12151A" font-size="20" font-family="Palatino Linotype, Palatino, Georgia, serif">Node.js · NestJS · Django · FastAPI · ASP.NET</text>
  </g>

  <g class="row r4" transform="translate(72 370)">
    <text x="0" y="0" fill="#1E4A7A" font-size="13" font-family="Gill Sans, Gill Sans MT, Trebuchet MS, sans-serif" letter-spacing="2.5">DATA &amp; OPS</text>
    <path d="M0 16H1056" stroke="#C5CCD4"/>
    <text x="0" y="48" fill="#12151A" font-size="20" font-family="Palatino Linotype, Palatino, Georgia, serif">MongoDB · PostgreSQL · Docker · Git · Jest · Playwright</text>
  </g>
</svg>
