<svg width="1200" height="590" viewBox="0 0 1200 590" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="30" y1="20" x2="1170" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071421"/>
      <stop offset=".5" stop-color="#0B1C2C"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".45" stop-color="#2DD4BF"/>
      <stop offset=".72" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#22D3EE" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .rail{animation:rail 2s linear infinite}
      .scan{animation:scan 5s ease-in-out infinite}
      .tile-bg{animation:border 4s ease-in-out infinite}
      .logo{animation:logo 3s ease-in-out infinite}
      .d2 .tile-bg,.d2 .logo{animation-delay:.25s}.d3 .tile-bg,.d3 .logo{animation-delay:.5s}
      .d4 .tile-bg,.d4 .logo{animation-delay:.75s}.d5 .tile-bg,.d5 .logo{animation-delay:1s}
      @keyframes rail{to{stroke-dashoffset:-36}}
      @keyframes scan{0%,100%{transform:translateX(-190px);opacity:0}15%,80%{opacity:.8}90%{transform:translateX(1190px);opacity:0}}
      @keyframes border{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
      @keyframes logo{0%,100%{opacity:.72}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.rail,.scan,.tile-bg,.logo{animation:none}}
    </style>
  </defs>

