<svg width="580" height="440" viewBox="0 0 580 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .block { animation: rise .7s ease both; }
      .b2 { animation-delay: .1s; }
      .b3 { animation-delay: .2s; }
      .b4 { animation-delay: .3s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .block { animation: none; opacity: 1; }
      }
    </style>
  </defs>
  <rect width="580" height="440" fill="#141414"/>
  <rect x="0" y="0" width="580" height="6" fill="#C1121F"/>

  <text x="36" y="52" fill="#C1121F" font-size="12" font-family="Trebuchet MS, sans-serif" letter-spacing="3">02 / TOOLKIT</text>
  <text x="36" y="92" fill="#F7F7F5" font-size="30" font-family="Georgia, Times New Roman, serif" font-weight="700">What I use</text>
  <text x="36" y="124" fill="#9A9A9A" font-size="14" font-family="Trebuchet MS, sans-serif">A practical stack, not a logo wall.</text>

  <g class="block" transform="translate(36 168)">
    <text x="0" y="0" fill="#8A8A8A" font-size="11" font-family="Trebuchet MS, sans-serif" letter-spacing="2">LANGUAGES</text>
    <text x="0" y="28" fill="#F7F7F5" font-size="17" font-family="Georgia, Times New Roman, serif">JavaScript · TypeScript · Python</text>
    <text x="0" y="52" fill="#F7F7F5" font-size="17" font-family="Georgia, Times New Roman, serif">C# · C++</text>
  </g>
  <g class="block b2" transform="translate(36 240)">
    <text x="0" y="0" fill="#8A8A8A" font-size="11" font-family="Trebuchet MS, sans-serif" letter-spacing="2">FRONTEND</text>
    <text x="0" y="28" fill="#F7F7F5" font-size="17" font-family="Georgia, Times New Roman, serif">React · Next.js · Tailwind</text>
    <text x="0" y="52" fill="#F7F7F5" font-size="17" font-family="Georgia, Times New Roman, serif">Material UI · HTML / CSS</text>
  </g>
  <g class="block b3" transform="translate(36 312)">
    <text x="0" y="0" fill="#8A8A8A" font-size="11" font-family="Trebuchet MS, sans-serif" letter-spacing="2">BACKEND</text>
    <text x="0" y="28" fill="#F7F7F5" font-size="17" font-family="Georgia, Times New Roman, serif">Node · NestJS · Django · FastAPI · ASP.NET</text>
  </g>
  <g class="block b4" transform="translate(36 372)">
    <text x="0" y="0" fill="#8A8A8A" font-size="11" font-family="Trebuchet MS, sans-serif" letter-spacing="2">DATA &amp; OPS</text>
    <text x="0" y="28" fill="#F7F7F5" font-size="17" font-family="Georgia, Times New Roman, serif">MongoDB · PostgreSQL · Docker · Git · Jest</text>
  </g>
</svg>
